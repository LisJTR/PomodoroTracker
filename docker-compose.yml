services:
  db:
   image: mysql:8.0
   container_name: mysql-pomodoro
   environment:
    MYSQL_DATABASE: mysql_pomodoro
    MYSQL_ROOT_PASSWORD: root
   ports:
    - "3307:3306"
   volumes:
    - "mysql_data:/var/lib/mysql"
  
  app:
   build: .
   container_name: pomodoro-backend
   depends_on:
    - db
   ports:
    - "8080:8080"
   environment:
    SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mysql_pomodoro
    SPRING_DATASOURCE_USERNAME: root
    SPRING_DATASOURCE_PASSWORD: root
   
volumes:
  mysql_data:
